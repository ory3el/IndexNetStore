<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste TOEIC (Listening &amp; Reading)</title>
<style>
:root{--bg:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--border-light:#e5e7eb;--panel:#f8f9fa;--chip:#e9edf3;--accent:#1d4ed8;--accent-soft:#eff4ff;--ok:#166534;--ok-soft:#ecfdf5;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:var(--bg);border-bottom:1px solid var(--border-light)}
.brand{display:flex;align-items:center;gap:12px}.logo{font-size:32px;font-weight:800;letter-spacing:-1.5px;line-height:1}.logo small{font-size:9px;font-weight:400;vertical-align:bottom}.title{font-size:13px;font-weight:600}.title span{font-weight:400;color:var(--muted)}
.timers{display:flex;gap:16px}.timer{text-align:center}.timer label{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}.timer strong{font-size:11px;font-variant-numeric:tabular-nums}
main{max-width:1000px;margin:0 auto;padding:28px 20px 40px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:8px}.block-header{font-size:12px;color:var(--muted)}.part-chip{font-size:11px;color:var(--accent);font-weight:700;padding:4px 8px;border:1px solid #bfdbfe;border-radius:999px;background:var(--accent-soft)}
.columns{display:grid;grid-template-columns:2fr 3fr;gap:24px;align-items:start}.context{background:var(--panel);border:1px solid var(--border-light);border-radius:var(--radius);padding:16px;font-size:13px;line-height:1.45;min-height:120px}.context p{margin-bottom:14px}.context p:last-child{margin-bottom:0}.context mark{background:none;color:#c2410c}
.question{margin-bottom:24px}.question h3{font-size:14px;font-weight:500;margin-bottom:10px}.question .subhint{font-size:11px;color:var(--muted);margin:-3px 0 10px}.option{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);text-align:left;font-size:13px;color:var(--text);transition:border-color .15s,background .15s}.option:hover{border-color:#9ca3af}.option .letter{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--chip);font-size:11px;font-weight:600;color:#000}.option.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}.option.selected .letter{background:var(--accent);color:#fff}.option.audio-only .letter{width:30px;height:30px;font-size:12px}.audio-only{font-size:13px}
.picture{width:100%;display:block;border:1px solid var(--border);border-radius:6px;margin-bottom:12px;background:#f7f7f7}.audio-card{border:1px solid var(--border-light);background:#fff;border-radius:8px;padding:12px;margin-bottom:18px}.audio-title{font-size:12px;font-weight:700;margin-bottom:8px}.play-row{display:flex;align-items:center;gap:12px}.play-btn{padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:16px;font-weight:700}.play-btn:hover:not(:disabled){background:var(--accent-soft)}.play-btn:disabled{opacity:.45;cursor:not-allowed}.audio-status{font-size:11px;color:var(--muted)}.audio-note{margin-top:8px;font-size:11px;color:var(--muted)}
.multiple-passages{display:grid;gap:12px}.passage-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px}.passage-card .passage-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.3px}.part-directions{background:var(--accent-soft);border:1px solid #dbeafe;border-radius:6px;padding:12px;font-size:12px;color:#1e3a8a;margin-bottom:14px}.hidden-script{display:none}
footer{display:flex;justify-content:space-between;margin-top:8px}.btn{padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500}.btn-prev{background:var(--bg);border:1px solid var(--muted);color:var(--muted)}.btn-prev:hover:not(:disabled){color:var(--text);border-color:var(--text)}.btn-prev:disabled{opacity:.45;cursor:not-allowed}.btn-next{background:var(--accent);border:none;color:#fff}.btn-next:hover{background:#1e40af}.section-switch{display:none;margin:40px auto;max-width:600px;text-align:center;padding:24px;border:1px solid var(--border-light);border-radius:10px;background:var(--panel)}
#results{display:none;max-width:780px;margin:0 auto;padding:64px 20px;text-align:center}#results .confetti{font-size:56px;line-height:1}#results h1{font-size:32px;margin:12px 0 4px}#results p.sub{color:var(--muted);margin-bottom:32px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:24px 12px;border-radius:12px}.card .icon{font-size:28px}.card .value{font-size:36px;font-weight:700;line-height:1.2}.card .label{font-size:13px;color:var(--muted)}.card.yellow{background:#fef9c3}.card.green{background:#dcfce7}.card.blue{background:#dbeafe}.details{margin:24px 0;color:var(--muted);font-size:13px}.official-note{margin-top:16px;padding:12px;border:1px solid var(--border-light);border-radius:8px;background:#fafafa;text-align:left;font-size:12px;color:var(--muted)}
@media(max-width:720px){.columns,.cards{grid-template-columns:1fr}header{padding:8px 14px}.title{display:none}.topline{align-items:flex-start;flex-direction:column}.play-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">*toeic.<small> ®</small></div><div class="title">Teste TOEIC <span>(Listening &amp; Reading)</span></div></div>
  <div class="timers">
    <div class="timer"><label>Seção</label><strong id="sectionName">Listening</strong></div>
    <div class="timer"><label>Tempo restante</label><strong id="remaining">45:00</strong></div>
    <div class="timer"><label>Tempo total</label><strong id="elapsed">00:00</strong></div>
  </div>
</header>

<main id="quiz">
  <div class="topline"><div class="block-header" id="blockHeader"></div><div class="part-chip" id="partChip"></div></div>
  <div class="columns">
    <section class="context" id="context"></section>
    <section id="questions"></section>
  </div>
  <footer>
    <button class="btn btn-prev" id="prevBtn">Anterior</button>
    <button class="btn btn-next" id="nextBtn">Próxima</button>
  </footer>
</main>

<section id="results">
  <div class="confetti">🎉</div>
  <h1>Teste concluído</h1>
  <p class="sub">Resultados brutos do seu treino TOEIC Listening &amp; Reading.</p>
  <div class="cards">
    <div class="card yellow"><div class="icon">🎧</div><div class="value" id="resListening">0/100</div><div class="label">Listening</div></div>
    <div class="card green"><div class="icon">📖</div><div class="value" id="resReading">0/100</div><div class="label">Reading</div></div>
    <div class="card blue"><div class="icon">📊</div><div class="value" id="resTotal">0/200</div><div class="label">Total de acertos</div></div>
  </div>
  <p class="details" id="resDetails"></p>
  <button class="btn btn-next" onclick="window.location.href = 'https://simulado.toeic.com.br'" id="restartBtn">Voltar ao Início</button>
</section>

le struggle to fall asleep because of stress, irregular schedules, too much caffeine, or long hours in front of a screen.</p><p>Experts recommend a few simple habits: go to bed at the same time every night, avoid coffee after 3 p.m., and keep your bedroom dark and quiet. Reading a book instead of checking your phone can also help your mind relax.</p><p>If sleeplessness lasts more than a month, consult a doctor. Persistent insomnia can affect your mood, your memory, and your health.</p>","questions":[{"enunciado":"What is the purpose of the article?","opcoes":[["A","To inform about various causes of sleep disorder"],["B","To avoid alcohol"],["C","To contribute to a better day"],["D","To improve your mental well-being"]],"resposta_correta":"A"},{"enunciado":"What is NOT mentioned as a cause of insomnia?","opcoes":[["A","Stress"],["B","Caffeine"],["C","Noisy neighbors"],["D","Screen time"]],"resposta_correta":"C"},{"enunciado":"What do experts recommend doing after 3 p.m.?","opcoes":[["A","Taking a nap"],["B","Avoiding coffee"],["C","Exercising outdoors"],["D","Reading emails"]],"resposta_correta":"B"}]},{"title":"Questions 5-7 refer to the following email.","context":"<p>Date: April 4<br>From: <mark>HR</mark> department<br>To: Staff<br>Subject: Announcement</p><p>Dear Staff,</p><p>I am pleased to announce that Kenzo Sato is joining ASY Industry to fill our open position in the engineering department. His first day is Wednesday, May 6.</p><p>Kenzo has worked for a number of years in one of the largest global manufacturers of vehicles, where he successfully managed his tasks with enthusiasm and professionalism. We are delighted to welcome him to the ASY team. If you see him around the building, make sure you welcome him to the company and answer any questions he might have. He will take part in employee onboarding activities for his first couple of weeks on the job.</p><p>Kenzo will work closely with the automotive team and will be responsible for the new car design project. Those who are involved in this project should feel free to reach out to Kenzo via email at kenzo_sto@asy.com or call him directly at 555-4830. We believe that Kenzo has a lot to share with his new coworkers, as he spent many years abroad.</p>","questions":[{"enunciado":"Who is the letter intended for?","opcoes":[["A","Engineers"],["B","Project team"],["C","Human Resource Department"],["D","Employees"]],"resposta_correta":"D"},{"enunciado":"What is the main purpose of the letter?","opcoes":[["A","To welcome a new worker"],["B","To present the new car design"],["C","To greet the largest global manufacturer"],["D","To invite employees for a new project"]],"resposta_correta":"A"},{"enunciado":"What does Klaus Weismann say about Kenzo Sato?","opcoes":[["A","He is an experienced HR worker"],["B","He is responsible for global manufacturing"],["C","He is not dynamic and professional engineer"],["D","He is a committed and devoted worker"]],"resposta_correta":"D"}]},{"title":"Questions refer to the following notice.","context":"<p><strong>Parking Lot Maintenance</strong></p><p>The north parking lot will be closed on Saturday from 7 A.M. to 3 P.M. while the pavement is repaired. Employees who normally park there should use the east lot instead. Please remove all vehicles before 7 A.M. Towed vehicles will be taken to the municipal storage facility.</p>","questions":[{"enunciado":"Why will the north parking lot be closed?","opcoes":[["A","For a company picnic"],["B","For pavement repairs"],["C","For employee training"],["D","For a delivery"]],"resposta_correta":"B"},{"enunciado":"When will the closure end?","opcoes":[["A","At 7 A.M."],["B","At noon"],["C","At 3 P.M."],["D","At 5 P.M."]],"resposta_correta":"C"},{"enunciado":"Where should affected employees park?","opcoes":[["A","In the north lot"],["B","On the street"],["C","In the east lot"],["D","At the municipal facility"]],"resposta_correta":"C"}]},{"title":"Questions refer to the following advertisement.","context":"<p><strong>Greenline Language Center</strong></p><p>Improve your business English in six weeks. Our evening classes meet Tuesdays and Thursdays from 6:30 to 8:00 P.M. The next session begins June 2. Students may choose small-group conversation practice or individual coaching. Register online by May 25 and receive a free placement test.</p>","questions":[{"enunciado":"How long does the program last?","opcoes":[["A","Four weeks"],["B","Six weeks"],["C","Eight weeks"],["D","Ten weeks"]],"resposta_correta":"B"},{"enunciado":"When do classes meet?","opcoes":[["A","Mondays and Wednesdays"],["B","Tuesdays and Thursdays"],["C","Every weekday"],["D","Weekends only"]],"resposta_correta":"B"},{"enunciado":"What is included for people who register by May 25?","opcoes":[["A","A textbook"],["B","Private lessons"],["C","A free placement test"],["D","A certificate"]],"resposta_correta":"C"}]},{"title":"Questions refer to the following memo.","context":"<p><strong>To: Sales Team</strong><br><strong>From: Nina Patel, Sales Manager</strong><br><strong>Subject: Quarterly Meeting</strong></p><p>Our quarterly meeting has been moved from Thursday to Friday because several regional managers will be traveling on Thursday. The meeting will begin at 9:30 A.M. in Conference Room B. Please bring your latest sales figures and a short summary of your largest account.</p>","questions":[{"enunciado":"Why was the meeting rescheduled?","opcoes":[["A","The room is unavailable"],["B","Managers will be traveling"],["C","Sales figures are incomplete"],["D","The manager is on vacation"]],"resposta_correta":"B"},{"enunciado":"When will the meeting begin?","opcoes":[["A","8:30 A.M."],["B","9:00 A.M."],["C","9:30 A.M."],["D","10:30 A.M."]],"resposta_correta":"C"},{"enunciado":"Where will the meeting take place?","opcoes":[["A","Conference Room A"],["B","Conference Room B"],["C","The sales office"],["D","The regional office"]],"resposta_correta":"B"}]},{"title":"Questions refer to the following email.","context ></p><p>9:00 — Dr. Kim / General consultation<br>10:00 — Dr. Silva / Dental cleaning<br>11:30 — Dr. Kim / Follow-up appointment<br>1:00 — Dr. Chen / Vaccination clinic<br>2:30 — Dr. Silva / Dental consultation</p>","questions":[{"enunciado":"Who is scheduled at 11:30?","opcoes":[["A","Dr. Chen"],["B","Dr. Kim"],["C","Dr. Silva"],["D","A nurse"]],"resposta_correta":"B"},{"enunciado":"What type of appointment is at 1:00?","opcoes":[["A","Dental cleaning"],["B","General consultation"],["C","Vaccination clinic"],["D","Follow-up appointment"]],"resposta_correta":"C"}]},{"title":"Questions refer to the following email.","context":"<p>Hi Jordan,</p><p>I have attached the draft of the marketing brochure. Could you review the product descriptions and check the prices against the current spreadsheet? I need your comments by Wednesday morning so I can send the final version to the printer on Thursday. Please ignore the old logo on page one; the design team is replacing it today.</p><p>Thanks,<br>Maria</p>","questions":[{"enunciado":"What does Maria want Jordan to review?","opcoes":[["A","The office schedule"],["B","Product descriptions and prices"],["C","The printer contract"],["D","The new logo design"]],"resposta_correta":"B"},{"enunciado":"When does Maria need Jordan's comments?","opcoes":[["A","Tuesday morning"],["B","Wednesday morning"],["C","Thursday afternoon"],["D","Friday morning"]],"resposta_correta":"B"}]},{"title":"Questions refer to the following announcement.","context":"<p><strong>Employee Shuttle Update</strong></p><p>Beginning September 1, the downtown shuttle will leave the main entrance every 30 minutes instead of every 45 minutes. The first departure will remain at 6:30 A.M., and the last departure will remain at 9:00 P.M. The change is being introduced to reduce waiting times during peak commuting hours.</p>","questions":[{"enunciado":"How often will the shuttle depart?","opcoes":[["A","Every 15 minutes"],["B","Every 30 minutes"],["C","Every 45 minutes"],[ How far in advance can rooms be reserved?","opcoes":[["A","30 days"],["B","45 days"],["C","60 days"],["D","90 days"]],"resposta_correta":"C"},{"enunciado":"When should equipment be requested?","opcoes":[["A","After the meeting"],["B","When the room is reserved"],["C","The day before the meeting"],["D","Only if equipment is unavailable"]],"resposta_correta":"B"}]},{"passages":[{"label":"E-mail","context":"<p>Dear residents,</p><p>The Maple Heights management office will test the building's fire alarm system on Tuesday between 2 and 4 P.M. Short alarms may sound during the test. No evacuation is required unless building staff gives a specific instruction. Residents who work from home may wish to use headphones during the test.</p>"},{"label":"Notice","context":"<p><strong>New Recycling Program</strong></p><p>Riverside Café has introduced separate bins for paper, glass, and food waste. Customers can find the bins beside the exit. The café says the program will help reduce the amount of trash sent to local landfills. Staff members have also begun using reusable containers for takeout orders.</p>"}],"questions":[{"enunciado":"What will be tested?","opcoes":[["A","The elevators"],["B","The fire alarm system"],["C","The heating system"],["D","The security cameras"]],"resposta_correta":"B"},{"enunciado":"When will the test occur?","opcoes":[["A","Monday morning"],["B","Tuesday between 2 and 4 P.M."],["C","Tuesday evening"],["D","Wednesday afternoon"]],"resposta_correta":"B"},{"enunciado":"Where are the recycling bins located?","opcoes":[["A","Beside the kitchen"],["B","Near the entrance"],["C","Beside the exit"],["D","Outside the parking lot"]],"resposta_correta":"C"},{"enunciado":"What type of waste has its own bin?","opcoes":[["A","Metal only"],["B","Food waste"],["C","Clothing"],["D","Batteries"]],"resposta_correta":"B"},{"enunciado":"What is one goal of the program?","opcoes":[["A","To increase menu prices"],["B","To reduce landfill waste"],["C","To add more tables"],["D","To serve takeout faster"]],"resposta_correta":"B"}]},{"passages":[{"label":"E-mail","context":"<p><strong>Downtown Bookstore Events</strong></p><p>Monday, 6 P.M. — Poetry reading<br>Wednesday, 5 P.M. — Children's story hour<br>Friday, 7 P.M. — Author interview<br>Saturday, 2 P.M. — Local history workshop</p>"},{"label":"Notice","context":"<p>Hello team,</p><p>The new time-tracking system will go live next Monday. Before then, everyone must complete the 20-minute training module in the employee portal. The system will record hours worked, vacation days, and project codes. Questions about access should be sent to IT Support.</p><p>Regards,<br>Priya</p>"}],"questions":[{"enunciado":"When is the poetry reading?","opcoes":[["A","Monday at 6 P.M."],["B","Wednesday at 5 P.M."],["C","Friday at 7 P.M."],["D","Saturday at 2 P.M."]],"resposta_correta":"A"},{"enunciado":"Which event is designed for children?","opcoes":[["A","Poetry reading"],["B","Story hour"],["C","Author interview"],["D","History workshop"]],"resposta_correta":"B"},{"enunciado":"When will the new system go live?","opcoes":[["A","This Friday"],["B","Next Monday"],["C","Next Wednesday"],["D","Next month"]],"resposta_correta":"B"},{"enunciado":"How long is the training module?","opcoes":[["A","10 minutes"],["B","15 minutes"],["C","20 minutes"],["D","30 minutes"]],"resposta_correta":"C"},{"enunciado":"What will the system record?","opcoes":[["A","Sales calls only"],["B","Hours, vacation days, and project codes"],["C","Customer complaints"],["D","Building access"]],"resposta_correta":"B"}]},{"passages":[{"label":"E-mail","context":"<p><strong>Harbor Tours</strong></p><p>Join our two-hour sunset cruise every Friday and Saturday at 6 P.M. Tickets cost $28 for adults and $14 for children under twelve. Reservations are recommended, but a limited number of walk-in tickets are available. Passengers should arrive at Pier 4 at least 20 minutes before departure.</p>"},{"label":"Notice","context":"<p><strong>Office Kitchen Reminder</strong></p><p>Please label any food stored in the shared refrigerator with your name and the date. Unlabeled items will be discarded every Friday afternoon. The freezer is currently full, so please avoid storing large containers there. Thank you for helping keep the kitchen clean.</p>"}],"questions":[{"enunciado":"How long is the cruise?","opcoes":[["A","One hour"],["B","Ninety minutes"],["C","Two hours"],["D","Three hours"]],"resposta_correta":"C"},{"enunciado":"When does the cruise depart?","opcoes":[["A","At 4 P.M."],["B","At 5 P.M."],["C","At 6 P.M."],["D","At 7 P.M."]],"resposta_correta":"C"},{"enunciado":"What should employees put on stored food?","opcoes":[["A","A price"],["B","Their name and the date"],["C","The room number"],["D","A manager's signature"]],"resposta_correta":"B"},{"enunciado":"When will unlabeled items be discarded?","opcoes":[["A","Every Monday"],["B","Thursday morning"],["C","Friday afternoon"],["D","At the end of each month"]],"resposta_correta":"C"},{"enunciado":"Why should employees avoid large containers in the freezer?","opcoes":[["A","It is broken"],["B","It is too cold"],["C","It is currently full"],["D","It is being cleaned"]],"resposta_correta":"C"}]},{"passages":[{"label":"Memo","context":"<p><strong>Northstar Printing</strong></p><p>Northstar Printing began as a family-owned shop in 1988 and now employs 42 people. In addition to business cards and brochures, the company produces event banners and custom packaging. Last year, Northstar added an online ordering system so customers can request quotes and upload files at any time.</p>"},{"label":"E-mail","context":"<p><strong>From: Facilities</strong><br><strong>Subject: Air-conditioning adjustment</strong></p><p>Several employees have reported that the west side of the office is too cold in the afternoon. Facilities will adjust the temperature controls this week. Until then, staff working in that area may request a desk fan from reception. Please return any borrowed fans by Friday.</p>"},{"label":"Article","context":"<p>Dear Mr. Evans,</p><p>Your appointment with the career adviser has been confirmed for March 18 at 3:15 P.M. Please bring an updated résumé and a list of questions about your job search. The appointment will last approximately 45 minutes. If you need to reschedule, contact the office at least one business day in advance.</p>"}],"questions":[{"enunciado":"When was Northstar Printing founded?","opcoes":[["A","1978"],["B","1988"],["C","1998"],["D","2008"]],"resposta_correta":"B"},{"enunciado":"How many people does the company employ?","opcoes":[["A","24"],["B","32"],["C","42"],["D","52"]],"resposta_correta":"C"},{"enunciado":"What problem has been reported?","opcoes":[["A","The west side is too hot"],["B","The west side is too cold"],["C","The lights are too dim"],["D","The elevators are too slow"]],"resposta_correta":"B"},{"enunciado":"What will Facilities do?","opcoes":[["A","Replace the windows"],["B","Move reception"],["C","Adjust temperature controls"],["D","Install new elevators"]],"resposta_correta":"C"},{"enunciado":"When is the appointment?","opcoes":[["A","March 8"],["B","March 18"],["C","March 28"],["D","April 18"]],"resposta_correta":"B"}]}],"readingSource":[{"titulo":"Questions 1-4 refer to the following article.","contexto":"<p><strong>Sleep Better Tonight</strong></p><p>Are you sick and tired of insomnia? You are not alone. Millions of people struggle to fall asleep because of stress, irregular schedules, too much caffeine, or long hours in front of a screen.</p><p>Experts recommend a few simple habits: go to bed at the same time every night, avoid coffee after 3 p.m., and keep your bedroom dark and quiet. Reading a book instead of checking your phone can also help your mind relax.</p><p>If sleeplessness lasts more than a month, consult a doctor. Persistent insomnia can affect your mood, your memory, and your health.</p>","questoes":[{"enunciado":"What is the purpose of the article?","opcoes":[["A","To inform about various causes of sleep disorder"],["B","To avoid alcohol"],["C","To contribute to a better day"],["D","To improve your mental well-being"]],"resposta_correta":"A"},{"enunciado":"What is NOT mentioned as a cause of insomnia?","opcoes":[["A","Stress"],["B","Caffeine"],["C","Noisy neighbors"],["D","Screen time"]],"resposta_correta":"C"},{"enunciado":"What do experts recommend doing after 3 p.m.?","opcoes":[["A","Taking a nap"],["B","Avoiding coffee"],["C","Exercising outdoors"],["D","Reading emails"]],"resposta_correta":"B"},{"enunciado":"When should a reader see a doctor?","opcoes":[["A","After one bad night"],["B","When the bedroom is too dark"],["C","If sleeplessness lasts over a month"],["D","Before reading a book"]],"resposta_correta":"C"}]},{"titulo":"Questions 5-7 refer to the following email.","contexto":"<p>Date: April 4<br>From: <mark>HR</mark> department<br>To: Staff<br>Subject: Announcement</p><p>Dear Staff,</p><p>I am pleased to announce that Kenzo Sato is joining ASY Industry to fill our open position in the engineering department. His first day is Wednesday, May 6.</p><p>Kenzo has worked for a number of years in one of the largest global manufacturers of vehicles, where he successfully managed his tasks with enthusiasm and professionalism. We are delighted to welcome him to the ASY team. If you see him around the building, make sure you welcome him to the company and answer any questions he might have. He will take part in employee onboarding activities for his first couple of weeks on the job.</p><p>Kenzo will work closely with the automotive team and will be responsible for the new car design project. Those who are involved in this project should feel free to reach out to Kenzo via email at kenzo_sto@asy.com or call him directly at 555-4830. We believe that Kenzo has a lot to share with his new coworkers, as he spent many years abroad.</p>","questoes":[{"enunciado":"Who is the letter intended for?","opcoes":[["A","Engineers"],["B","Project team"],["C","Human Resource Department"],["D","Employees"]],"resposta_correta":"D"},{"enunciado":"What is the main purpose of the letter?","opcoes":[["A","To welcome a new worker"],["B","To present the new car design"],["C","To greet the largest global manufacturer"],["D","To invite employees for a new project"]],"resposta_correta":"A"},{"enunciado":"What does Klaus Weismann say about Kenzo Sato?","opcoes":[["A","He is an experienced HR worker"],["B","He is responsible for global manufacturing"],["C","He is not dynamic and professional engineer"],["D","He is a committed and devoted worker"]],"resposta_correta":"D"},{"enunciado":"What will Kenzo be responsible for?","opcoes":[["A","Employee onboarding"],["B","The new car design project"],["C","HR recruitment"],["D","Vehicle sales"]],"resposta_correta":"B"}]},{"titulo":"Questions refer to the following notice.","contexto":"<p><strong>Parking Lot Maintenance</strong></p><p>The north parking lot will be closed on Saturday from 7 A.M. to 3 P.M. while the pavement is repaired. Employees who normally park there should use the east lot instead. Please remove all vehicles before 7 A.M. Towed vehicles will be taken to the municipal storage facility.</p>","questoes":[{"enunciado":"Why will the north parking lot be closed?","opcoes":[["A","For a company picnic"],["B","For pavement repairs"],["C","For employee training"],["D","For a delivery"]],"resposta_correta":"B"},{"enunciado":"When will the closure end?","opcoes":[["A","At 7 A.M."],["B","At noon"],["C","At 3 P.M."],["D","At 5 P.M."]],"resposta_correta":"C"},{"enunciado":"Where should affected employees park?","opcoes":[["A","In the north lot"],["B","On the street"],["C","In the east lot"],["D","At the municipal facility"]],"resposta_correta":"C"},{"enunciado":"What should employees do before 7 A.M.?","opcoes":[["A","Wash their cars"],["B","Move their vehicles"],["C","Call the repair crew"],["D","Reserve a space"]],"resposta_correta":"B"}]},{"titulo":"Questions refer to t oth ends of the day"]],"resposta_correta":"D"},{"enunciado":"Why is the schedule changing?","opcoes":[["A","To lower ticket prices"],["B","To reduce waiting times"],["C","To add a new route"],["D","To shorten the workday"]],"resposta_correta":"B"}]},{"titulo":"Questions refer to the following product review.","contexto":"<p>The AeroPack 25 backpack is lighter than most business backpacks and includes a padded laptop compartment, two water-bottle pockets, and a small organizer panel. Reviewers praised its comfortable straps but noted that the side pockets are too narrow for large bottles. The manufacturer offers a two-year warranty.</p>","questoes":[{"enunciado":"What feature is included in the backpack?","opcoes":[["A","A built-in battery"],["B","A padded laptop compartment"],["C","A hidden umbrella"],["D","A metal frame"]],"resposta_correta":"B"},{"enunciado":"What did reviewers like?","opcoes":[["A","The wide side pockets"],["B","The low price"],["C","The comfortable straps"],["D","The bright colors"]],"resposta_correta":"C"},{"enunciado":"What problem did reviewers mention?","opcoes":[["A","The straps break easily"],["B","The laptop compartment is too small"],["C","The bag is too heavy"],["D","The side pockets are narrow"]],"resposta_correta":"D"},{"enunciado":"How long is the warranty?","opcoes":[["A","Six months"],["B","One year"],["C","Two years"],["D","Five years"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following notice.","contexto":"<p><strong>Conference Room Reservation Policy</strong></p><p>Starting next month, all conference rooms must be reserved through the company calendar. Reservations may be made up to 60 days in advance. Employees who need equipment such as projectors or speakers should request it when making the reservation. Unused rooms should be released as soon as possible.</p>","questoes":[{"enunciado":"How must rooms be reserved?","opcoes":[["A","By telephone"],["B","Through the company calendar"],["C","With a paper form"  Customers can find the bins beside the exit. The café says the program will help reduce the amount of trash sent to local landfills. Staff members have also begun using reusable containers for takeout orders.</p>","questoes":[{"enunciado":"Where are the recycling bins located?","opcoes":[["A","Beside the kitchen"],["B","Near the entrance"],["C","Beside the exit"],["D","Outside the parking lot"]],"resposta_correta":"C"},{"enunciado":"What type of waste has its own bin?","opcoes":[["A","Metal only"],["B","Food waste"],["C","Clothing"],["D","Batteries"]],"resposta_correta":"B"},{"enunciado":"What is one goal of the program?","opcoes":[["A","To increase menu prices"],["B","To reduce landfill waste"],["C","To add more tables"],["D","To serve takeout faster"]],"resposta_correta":"B"},{"enunciado":"What have staff members started using?","opcoes":[["A","Paper cups"],["B","Plastic trays"],["C","Reusable containers"],["D","Glass bottles"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following schedule.","contexto":"<p><strong>Downtown Bookstore Events</strong></p><p>Monday, 6 P.M. — Poetry reading<br>Wednesday, 5 P.M. — Children's story hour<br>Friday, 7 P.M. — Author interview<br>Saturday, 2 P.M. — Local history workshop</p>","questoes":[{"enunciado":"When is the poetry reading?","opcoes":[["A","Monday at 6 P.M."],["B","Wednesday at 5 P.M."],["C","Friday at 7 P.M."],["D","Saturday at 2 P.M."]],"resposta_correta":"A"},{"enunciado":"Which event is designed for children?","opcoes":[["A","Poetry reading"],["B","Story hour"],["C","Author interview"],["D","History workshop"]],"resposta_correta":"B"},{"enunciado":"What event takes place on Friday?","opcoes":[["A","A poetry reading"],["B","A story hour"],["C","An author interview"],["D","A history workshop"]],"resposta_correta":"C"},{"enunciado":"What is the topic of the Saturday workshop?","opcoes":[["A","Local history"],["B","Modern art"],["C","Poetry"],["D","Children's books"]],"resposta_correta":"A"}]},{"titulo Arrive at Pier 4 early"],["B","Buy lunch"],["C","Check in online only"],["D","Bring a passport"]],"resposta_correta":"A"}]},{"titulo":"Questions refer to the following notice.","contexto":"<p><strong>Office Kitchen Reminder</strong></p><p>Please label any food stored in the shared refrigerator with your name and the date. Unlabeled items will be discarded every Friday afternoon. The freezer is currently full, so please avoid storing large containers there. Thank you for helping keep the kitchen clean.</p>","questoes":[{"enunciado":"What should employees put on stored food?","opcoes":[["A","A price"],["B","Their name and the date"],["C","The room number"],["D","A manager's signature"]],"resposta_correta":"B"},{"enunciado":"When will unlabeled items be discarded?","opcoes":[["A","Every Monday"],["B","Thursday morning"],["C","Friday afternoon"],["D","At the end of each month"]],"resposta_correta":"C"},{"enunciado":"Why should employees avoid large containers in the freezer?","opcoes":[["A","It is broken"],["B","It is too cold"],["C","It is currently full"],["D","It is being cleaned"]],"resposta_correta":"C"},{"enunciado":"What is the reminder mainly about?","opcoes":[["A","Ordering food"],["B","Keeping the shared kitchen organized"],["C","Repairing appliances"],["D","Changing office hours"]],"resposta_correta":"B"}]},{"titulo":"Questions refer to the following company profile.","contexto":"<p><strong>Northstar Printing</strong></p><p>Northstar Printing began as a family-owned shop in 1988 and now employs 42 people. In addition to business cards and brochures, the company produces event banners and custom packaging. Last year, Northstar added an online ordering system so customers can request quotes and upload files at any time.</p>","questoes":[{"enunciado":"When was Northstar Printing founded?","opcoes":[["A","1978"],["B","1988"],["C","1998"],["D","2008"]],"resposta_correta":"B"},{"enunciado":"How many people does the company employ?","opcoes":[["A","24"],["B","32"],[ function deepClone(v) { return JSON.parse(JSON.stringify(v)); }
function fmt(s) { return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`; }
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function makeAudioKey(group) { return `${state.section}:${group.key}`; }

function speakingVoice(role='narrator') {
  const voices = speechSynthesis.getVoices().filter(v => /^en-(US|GB|AU|CA|IN)/i.test(v.lang));
  if (!voices.length) return null;
  const preferred = role === 'female' ? voices.find(v => /female|zira|samantha|susan|victoria|karen|moira/i.test(v.name)) :
                    role === 'male' ? voices.find(v => /male|david|daniel|alex|fred|george/i.test(v.name)) : null;
  return preferred || voices[0];
}

function speakSegments(segments, onDone) {
  speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if (i >= segments.length) { onDone && onDone(); return; }
    const seg = segments[i++];
    const u = new SpeechSynthesisUtterance(seg.text);
    u.lang = seg.lang || 'en-US';
    u.rate = seg.rate || 0.95;
    u.pitch = seg.pitch || (seg.role === 'female' ? 1.08 : seg.role === 'male' ? 0.94 : 1);
    const voice = speakingVoice(seg.role);
    if (voice) u.voice = voice;
    u.onend = () => setTimeout(next, seg.pause == null ? 450 : seg.pause);
    u.onerror = () => setTimeout(next, 250);
    speechSynthesis.speak(u);
  };
  next();
}

function audioSegments(group) {
  const s=[];
  if (group.type === 'p1') {
    s.push({text:'Look at the picture marked for this question.', role:'narrator', pause:650});
    group.statements.forEach((x,idx)=>s.push({text:`(${String.fromCharCode(65+idx)}) ${x.slice(3)}`, role:'narrator', pause:700}));
  } else if (group.type === 'p2') {
    s.push({text:group.prompt, role:'narrator', pause:900});
    group.responses.forEach((x,idx)=>s.push({text:`(${String.fromCharCode(65+idx)}) ${x.slice(3)}`, role:'narrator', pause:850}));
  } else {
    group.segments.forEach(seg=>s.push({text:seg[1], role:seg[0].toLowerCase()==='woman'?'female':'male', pause:500}));
    group.questions.forEach((q,idx)=>s.push({text:`Question ${idx+1}. ${q.enunciado}`, role:'narrator', pause:800}));
  }
  return s;
}

function renderAudioButton(group) {
  const key=makeAudioKey(group);
  const played=!!state.audioPlayed[key];
  return `<div class="audio-card"><div class="audio-title">Áudio da questão</div><div class="play-row"><button type="button" class="play-btn" id="playBtn" ${played?'disabled':''}>▶ PLAY</button><span class="audio-status" id="audioStatus">${played?'Áudio já reproduzido — não pode ser ouvido novamente.':'Ouça o áudio uma única vez.'}</span></div><div class="audio-note">O roteiro do áudio não é exibido. O botão fica bloqueado após a primeira reprodução.</div></div>`;
}

function currentPart() {
  if (state.section === 'listening') {
    if (state.groupIndex < 6) return 'Part 1 — Photographs';
    if (state.groupIndex < 31) return 'Part 2 — Question-Response';
    if (state.groupIndex < 44) return 'Part 3 — Conversations';
    return 'Part 4 — Talks';
  }
  if (state.groupIndex < 6) return 'Part 5 — Incomplete Sentences';
  if (state.groupIndex < 10) return 'Part 6 — Text Completion';
  if (state.groupIndex < 20) return 'Part 7 — Single Passages';
  const g=state.groups[state.groupIndex];
  return g.subpart || 'Part 7 — Reading Comprehension';
}

function buildListeningGroups() {
  const out=[]; let n=1;
  DATA.part1.forEach((x,i)=>out.push({...deepClone(x), key:'L1-'+i, start:n, end:n++, part:'Part 1'}));
  DATA.part2.forEach((x,i)=>out.push({...deepClone(x), key:'L2-'+i, start:n, end:n++, part:'Part 2'}));
  DATA.part3.forEach((x,i)=>out.push({...deepClone(x), key:'L3-'+i, start:n, end:n+2, part:'Part 3'}), n+=3);
  DATA.part4.forEach((x,i)=>out.push({...deepClone(x), key:'L4-'+i, start:n, end:n+2, part:'Part 4'}), n+=3);
  // Add stable question IDs into group questions.
  for (const g of out) {
    if (g.type==='p1' || g.type==='p2') { g.questions=[{enunciado: g.type==='p1'?'Which statement best describes the picture?':'Select the best response to the question or statement.', opcoes:(g.type==='p1'?g.statements.map((x,i)=>[String.fromCharCode(65+i),'']):g.responses.map((x,i)=>[String.fromCharCode(65+i),''])), resposta_correta:g.answer, id:g.start}]; }
    else g.questions=g.questions.map((qq,i)=>({...qq,id:g.start+i}));
  }
  return out;
}

function cloneReadingQuestion(oldq) { return {enunciado:oldq.enunciado, opcoes:oldq.opcoes.map(o=>[o[0],o[1]]), resposta_correta:oldq.resposta_correta}; }

function buildReadingGroups() {
  const out=[]; let n=101;
  // Part 5: 30 individual items, displayed in pages of 5 for navigation.
  for(let i=0;i<DATA.part5.length;i+=5) {
    const groupQ=DATA.part5.slice(i,i+5).map((qq,j)=>({...deepClone(qq),id:n+i+j}));
    out.push({type:'r',key:'R5-'+i,start:n+i,end:n+i+groupQ.length-1,part:'Part 5',subpart:'Part 5 — Incomplete Sentences',direction:'Choose the word or phrase that best completes each sentence.',context:'<div class="part-directions"><strong>Part 5 — Incomplete Sentences</strong><br>Choose the word or phrase that best completes each sentence.</div>',questions:groupQ});
  }
  n=131;
  DATA.part6.forEach((b,i)=>{out.push({type:'r',key:'R6-'+i,start:n,end:n+3,part:'Part 6',subpart:'Part 6 — Text Completion',context:b.context,title:b.title,questions:b.questions.map((qq,j)=>({...deepClone(qq),id:n+j}))}); n+=4;});
  n=147;
  // Part 7: choose 21 different source blocks from the supplied reading bank on each restart.
  // This changes the practice material while preserving the official 29 + 25 question structure.
  const source = shuffle(DATA.readingSource);
  const singleCounts=[3,3,3,3,3,3,3,2,2,4];
  source.slice(0,10).forEach((b,i)=>{
    const count=singleCounts[i];
    const start=n, end=n+count-1;
    out.push({type:'r',key:'R7S-'+i,start,end,part:'Part 7',subpart:'Part 7 — Single Passages',title:`Questions ${start}-${end} refer to the following passage.`,context:b.contexto,questions:b.questoes.slice(0,count).map((qq,j)=>({...cloneReadingQuestion(qq),id:n+j}))});
    n+=count;
  });
  // Four double-passage sets (2 + 3 questions) and one triple-passage set (2 + 2 + 1).
  const pairs=[[10,11],[12,13],[14,15],[16,17]];
  pairs.forEach((pair,i)=>{
    const a=source[pair[0]], b=source[pair[1]], start=n, end=n+4;
    const questions=[...a.questoes.slice(0,2).map(cloneReadingQuestion), ...b.questoes.slice(0,3).map(cloneReadingQuestion)].map((qq,j)=>({...qq,id:n+j}));
    out.push({type:'r-multi',key:'R7M-'+i,start,end,part:'Part 7',subpart:'Part 7 — Multiple Passages',passages:[{label:'Passage 1',context:a.contexto},{label:'Passage 2',context:b.contexto}],questions});
    n+=5;
  });
  const t1=source[18], t2=source[19], t3=source[20], start=n, end=n+4;
  const tripleQuestions=[...t1.questoes.slice(0,2).map(cloneReadingQuestion), ...t2.questoes.slice(0,2).map(cloneReadingQuestion), ...t3.questoes.slice(0,1).map(cloneReadingQuestion)].map((qq,j)=>({...qq,id:n+j}));
  out.push({type:'r-multi',key:'R7M-4',start,end,part:'Part 7',subpart:'Part 7 — Multiple Passages',passages:[{label:'Passage 1',context:t1.contexto},{label:'Passage 2',context:t2.contexto},{label:'Passage 3',context:t3.contexto}],questions:tripleQuestions});
  n+=5;
  if(n!==201) throw new Error('Reading numbering failed: '+n);
  return out;
}

function prepare() {
  state.section='listening';
  state.groupIndex=0;
  state.groups=buildListeningGroups();
  state.answers={}; state.audioPlayed={}; state.elapsedTotal=0; state.sectionElapsed=0; state.finalizado=false; state.audioPlaying=false;
  el.sectionName.textContent='Listening';
  el.remaining.textContent=fmt(LISTENING_SECONDS);
  el.elapsed.textContent='00:00';
  render();
  startTimer();
}

function render() {
  const g=state.groups[state.groupIndex];
  el.header.textContent=`Questões ${g.start}${g.end===g.start?'':'-'+g.end} de 200`;
  el.partChip.textContent=currentPart();
  if(state.section==='listening') renderListening(g); else renderReading(g);
  const inListening=state.section==='listening';
  el.prev.disabled=inListening || state.groupIndex===0;
  el.next.textContent=(inListening && state.groupIndex===state.groups.length-1)?'Ir para Reading':(!inListening && state.groupIndex===state.groups.length-1?'Finalizar':'Próxima');
  el.next.disabled = inListening && state.audioPlaying;
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderListening(g) {
  let context='';
  if(g.type==='p1') context=`<div class="part-directions"><strong>Part 1 — Photographs</strong><br>Observe a imagem. As quatro descrições são ouvidas e não aparecem no teste oficial. Escolha a letra da descrição que melhor combina com a imagem.</div><img class="picture" src="${g.image}" alt="Imagem da questão ${g.start}">`;
  else if(g.type==='p2') context=`<div class="part-directions"><strong>Part 2 — Question-Response</strong><br>Você ouvirá uma pergunta ou afirmação e três respostas. Elas são ouvidas apenas uma vez. Marque A, B ou C.</div>`;
  else context=`<div class="part-directions"><strong>${g.type==='p3'?'Part 3 — Conversations':'Part 4 — Talks'}</strong><br>O áudio é reproduzido uma única vez. As perguntas e alternativas ficam disponíveis para você responder após ouvir.</div>`;
  el.context.innerHTML=context;
  let html=renderAudioButton(g);
  if(g.type==='p1' || g.type==='p2') {
    const count=g.type==='p1'?4:3;
    html += `<div class="question"><h3>${g.start}. ${g.type==='p1'?'Select the best statement.':'Select the best response.'}</h3><div class="subhint">Apenas a letra é mostrada, para manter o formato auditivo.</div>`;
    for(let i=0;i<count;i++) html += `<button type="button" class="option audio-only ${state.answers[g.start]===String.fromCharCode(65+i)?'selected':''}" data-q="${g.start}" data-a="${String.fromCharCode(65+i)}"><span class="letter">${String.fromCharCode(65+i)}</span><span>Alternativa ${String.fromCharCode(65+i)}</span></button>`;
    html += `</div>`;
  } else {
    g.questions.forEach(qq=>{
      html+=`<div class="question"><h3>${qq.id}. ${qq.enunciado}</h3>`;
      qq.opcoes.forEach(o=>html+=`<button type="button" class="option ${state.answers[qq.id]===o[0]?'selected':''}" data-q="${qq.id}" data-a="${o[0]}"><span class="letter">${o[0]}</span><span>${o[1]}</span></button>`);
      html+='</div>';
    });
  }
  el.questions.innerHTML=html;
  const play=$('playBtn');
  if(play && !play.disabled) play.addEventListener('click',()=>playAudio(g));
}

function renderReading(g) {
  if(g.type==='r-multi') {
    el.context.innerHTML=`<div class="part-directions"><strong>Part 7 — Multiple Passages</strong><br>Leia os textos relacionados e responda às cinco perguntas.</div><div class="multiple-passages">${g.passages.map(p=>`<div class="passage-card"><div class="passage-label">${p.label}</div>${p.context}</div>`).join('')}</div>`;
  } else {
    el.context.innerHTML=g.context || `<div class="part-directions">${g.direction||''}</div>`;
  }
  let html='';
  g.questions.forEach(qq=>{
    html+=`<div class="question"><h3>${qq.id}. ${qq.enunciado}</h3>`;
    qq.opcoes.forEach(o=>html+=`<button type="button" class="option ${state.answers[qq.id]===o[0]?'selected':''}" data-q="${qq.id}" data-a="${o[0]}"><span class="letter">${o[0]}</span><span>${o[1]}</span></button>`);
    html+='</div>';
  });
  el.questions.innerHTML=html;
}

function playAudio(g) {
  const key=makeAudioKey(g);
  if(state.audioPlayed[key] || state.audioPlaying) return;
  state.audioPlayed[key]=true;
  state.audioPlaying=true;
  el.next.disabled=true;
  const play=$('playBtn'), status=$('audioStatus');
  if(play) play.disabled=true;
  if(status) status.textContent='Áudio em reprodução…';
  speakSegments(audioSegments(g),()=>{
    state.audioPlaying=false;
    el.next.disabled=false;
    if(status) status.textContent='Áudio finalizado — reprodução bloqueada.';
  });
}

el.questions.addEventListener('click',e=>{
  const btn=e.target.closest('.option'); if(!btn || state.finalizado) return;
  const qid=Number(btn.dataset.q); const a=btn.dataset.a; state.answers[qid]=a;
  btn.parentElement.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',o===btn));
});

el.prev.addEventListener('click',()=>{
  if(state.section==='reading' && state.groupIndex>0 && !state.finalizado) { state.groupIndex--; render(); }
});

el.next.addEventListener('click',()=>{
  if(state.finalizado) return;
  if(state.section==='listening' && state.audioPlaying) return;
  speechSynthesis.cancel();
  state.audioPlaying=false;
  if(state.section==='listening') {
    if(state.groupIndex<state.groups.length-1) { state.groupIndex++; render(); }
    else switchToReading();
  } else {
    if(state.groupIndex<state.groups.length-1) { state.groupIndex++; render(); }
    else finalize();
  }
});

function startTimer() { clearInterval(state.timerId); state.timerId=setInterval(()=>{
  if(state.finalizado) return;
  state.elapsedTotal++; state.sectionElapsed++;
  el.elapsed.textContent=fmt(state.elapsedTotal);
  const limit=state.section==='listening'?LISTENING_SECONDS:READING_SECONDS;
  el.remaining.textContent=fmt(Math.max(limit-state.sectionElapsed,0));
  if(state.sectionElapsed>=limit) {
    if(state.section==='listening') switchToReading(true); else finalize();
  }
},1000); }

function switchToReading(auto=false) {
  speechSynthesis.cancel();
  state.section='reading'; state.groupIndex=0; state.groups=buildReadingGroups(); state.sectionElapsed=0; state.audioPlaying=false;
  el.sectionName.textContent='Reading'; el.remaining.textContent=fmt(READING_SECONDS); render();
  if(auto) { }
}

function finalize() {
  if(state.finalizado) return;
  state.finalizado=true; clearInterval(state.timerId); speechSynthesis.cancel();
  const all=[...buildListeningGroups(), ...buildReadingGroups()].flatMap(g=>g.questions);
  const listening=all.filter(q=>q.id<=100); const reading=all.filter(q=>q.id>=101);
  const lCorrect=listening.filter(q=>state.answers[q.id]===q.resposta_correta).length;
  const rCorrect=reading.filter(q=>state.answers[q.id]===q.resposta_correta).length;
  const total=lCorrect+rCorrect;
  $('resListening').textContent=`${lCorrect}/100`;
  $('resReading').textContent=`${rCorrect}/100`;
  $('resTotal').textContent=`${total}/200`;
  $('resDetails').textContent=`Respondidas: ${Object.keys(state.answers).length}/200 • Tempo total: ${fmt(state.elapsedTotal)} • Listening: ${lCorrect}/100 • Reading: ${rCorrect}/100`;
  el.quiz.style.display='none'; el.results.style.display='block'; window.scrollTo({top:0,behavior:'smooth'});
}

$('restartBtn').addEventListener('click',prepare);

speechSynthesis.onvoiceschanged=()=>{};
prepare();
</script>
</body>
</html>

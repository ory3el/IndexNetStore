<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste TOEIC (Reading)</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
    --border-light: #e5e7eb;
    --panel: #f8f9fa;
    --chip: #e9edf3;
    --accent: #1d4ed8;
    --accent-soft: #eff4ff;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-light);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .logo small { font-size: 9px; font-weight: 400; vertical-align: bottom; }
  .title { font-size: 13px; font-weight: 600; }
  .title span { font-weight: 400; color: var(--muted); }
  .timers { display: flex; gap: 16px; }
  .timer { text-align: center; }
  .timer label { display: block; font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
  .timer strong { font-size: 11px; font-variant-numeric: tabular-nums; }

  /* Corpo */
  main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 40px; }
  .block-header { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .columns { display: grid; grid-template-columns: 2fr 3fr; gap: 24px; align-items: start; }
  .context {
    background: var(--panel);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 13px;
    line-height: 1.45;
  }
  .context p { margin-bottom: 14px; }
  .context p:last-child { margin-bottom: 0; }
  .context mark { background: none; color: #c2410c; }

  .question { margin-bottom: 24px; }
  .question h3 { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
  .option {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-align: left;
    font-size: 13px;
    color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .option:hover { border-color: #9ca3af; }
  .option .letter {
    flex: none;
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--chip);
    font-size: 11px; font-weight: 600; color: #000;
  }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Navegação */
  footer { display: flex; justify-content: space-between; margin-top: 8px; }
  .btn { padding: 7px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; }
  .btn-prev { background: var(--bg); border: 1px solid var(--muted); color: var(--muted); }
  .btn-prev:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .btn-prev:disabled { opacity: .45; cursor: not-allowed; }
  .btn-next { background: var(--accent); border: none; color: #fff; }
  .btn-next:hover { background: #1e40af; }

  /* Resultados */
  #results { display: none; max-width: 760px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  #results .confetti { font-size: 56px; line-height: 1; }
  #results h1 { font-size: 32px; margin: 12px 0 4px; }
  #results p.sub { color: var(--muted); margin-bottom: 32px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { padding: 24px 12px; border-radius: 12px; }
  .card .icon { font-size: 28px; }
  .card .value { font-size: 36px; font-weight: 700; line-height: 1.2; }
  .card .label { font-size: 13px; color: var(--muted); }
  .card.yellow { background: #fef9c3; }
  .card.green { background: #dcfce7; }
  .card.blue { background: #dbeafe; }
  .details { margin: 24px 0; color: var(--muted); font-size: 13px; }

  @media (max-width: 720px) {
    .columns, .cards { grid-template-columns: 1fr; }
    header { padding: 8px 14px; }
    .title { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">*toeic.<small></small></div>
    <div class="title">Teste TOEIC <span>(Reading)</span></div>
  </div>
  <div class="timers">
    <div class="timer"><label>Tempo decorrido</label><strong id="elapsed">00:00</strong></div>
    <div class="timer"><label>Tempo restante</label><strong id="remaining">75:00</strong></div>
  </div>
</header>

<main id="quiz">
  <div class="block-header" id="blockHeader"></div>
  <div class="columns">
    <section class="context" id="context"></section>
    <section id="questions"></section>
  </div>
  <footer>
    <button class="btn btn-prev" id="prevBtn">Anterior</button>
    <button class="btn btn-next" id="nextBtn">Próxima</button>
  </footer>
</main>

<section id="results">
  <div class="confetti">🎉</div>
  <h1>Muito bem!</h1>
  <p class="sub">Você concluiu o teste TOEIC.</p>
  <div class="cards">
    <div class="card yellow"><div class="icon">🏆</div><div class="value" id="resPoints">0</div><div class="label">Pontos</div></div>
    <div class="card green"><div class="icon">✅</div><div class="value" id="resAccuracy">0%</div><div class="label">Precisão</div></div>
    <div class="card blue"><div class="icon">📊</div><div class="value" id="resLevel">—</div><div class="label">Nível CEFR (aprox.)</div></div>
  </div>
  <p class="details" id="resDetails"></p>
  <button class="btn btn-next" id="restartBtn">Refazer simulado</button>
</section>

<script>
  /* ---------- Banco de dados: 156 questões únicas + 44 repetições aleatórias ---------- */
  const blocosBase = [{"titulo":"Questions 1-4 refer to the following article.","contexto":"<p><strong>Sleep Better Tonight</strong></p><p>Are you sick and tired of insomnia? You are not alone. Millions of people struggle to fall asleep because of stress, irregular schedules, too much caffeine, or long hours in front of a screen.</p><p>Experts recommend a few simple habits: go to bed at the same time every night, avoid coffee after 3 p.m., and keep your bedroom dark and quiet. Reading a book instead of checking your phone can also help your mind relax.</p><p>If sleeplessness lasts more than a month, consult a doctor. Persistent insomnia can affect your mood, your memory, and your health.</p>","questoes":[{"enunciado":"What is the purpose of the article?","opcoes":[["A","To inform about various causes of sleep disorder"],["B","To avoid alcohol"],["C","To contribute to a better day"],["D","To improve your mental well-being"]],"resposta_correta":"A"},{"enunciado":"What is NOT mentioned as a cause of insomnia?","opcoes":[["A","Stress"],["B","Caffeine"],["C","Noisy neighbors"],["D","Screen time"]],"resposta_correta":"C"},{"enunciado":"What do experts recommend doing after 3 p.m.?","opcoes":[["A","Taking a nap"],["B","Avoiding coffee"],["C","Exercising outdoors"],["D","Reading emails"]],"resposta_correta":"B"},{"enunciado":"When should a reader see a doctor?","opcoes":[["A","After one bad night"],["B","When the bedroom is too dark"],["C","If sleeplessness lasts over a month"],["D","Before reading a book"]],"resposta_correta":"C"}]},{"titulo":"Questions 5-7 refer to the following email.","contexto":"<p>Date: April 4<br>From: <mark>HR</mark> department<br>To: Staff<br>Subject: Announcement</p><p>Dear Staff,</p><p>I am pleased to announce that Kenzo Sato is joining ASY Industry to fill our open position in the engineering department. His first day is Wednesday, May 6.</p><p>Kenzo has worked for a number of years in one of the largest global manufacturers of vehicles, where he successfully managed his tasks with enthusiasm and professionalism. We are delighted to welcome him to the ASY team. If you see him around the building, make sure you welcome him to the company and answer any questions he might have. He will take part in employee onboarding activities for his first couple of weeks on the job.</p><p>Kenzo will work closely with the automotive team and will be responsible for the new car design project. Those who are involved in this project should feel free to reach out to Kenzo via email at kenzo_sto@asy.com or call him directly at 555-4830. We believe that Kenzo has a lot to share with his new coworkers, as he spent many years abroad.</p>","questoes":[{"enunciado":"Who is the letter intended for?","opcoes":[["A","Engineers"],["B","Project team"],["C","Human Resource Department"],["D","Employees"]],"resposta_correta":"D"},{"enunciado":"What is the main purpose of the letter?","opcoes":[["A","To welcome a new worker"],["B","To present the new car design"],["C","To greet the largest global manufacturer"],["D","To invite employees for a new project"]],"resposta_correta":"A"},{"enunciado":"What does Klaus Weismann say about Kenzo Sato?","opcoes":[["A","He is an experienced HR worker"],["B","He is responsible for global manufacturing"],["C","He is not dynamic and professional engineer"],["D","He is a committed and devoted worker"]],"resposta_correta":"D"},{"enunciado":"What will Kenzo be responsible for?","opcoes":[["A","Employee onboarding"],["B","The new car design project"],["C","HR recruitment"],["D","Vehicle sales"]],"resposta_correta":"B"}]},{"titulo":"Questions refer to the following notice.","contexto":"<p><strong>Parking Lot Maintenance</strong></p><p>The north parking lot will be closed on Saturday from 7 A.M. to 3 P.M. while the pavement is repaired. Employees who normally park there should use the east lot instead. Please remove all vehicles before 7 A.M. Towed vehicles will be taken to the municipal storage facility.</p>","questoes":[{"enunciado":"Why will the north parking lot be closed?","opcoes":[["A","For a company picnic"],["B","For pavement repairs"],["C","For employee training"],["D","For a delivery"]],"resposta_correta":"B"},{"enunciado":"When will the closure end?","opcoes":[["A","At 7 A.M."],["B","At noon"],["C","At 3 P.M."],["D","At 5 P.M."]],"resposta_correta":"C"},{"enunciado":"Where should affected employees park?","opcoes":[["A","In the north lot"],["B","On the street"],["C","In the east lot"],["D","At the municipal facility"]],"resposta_correta":"C"},{"enunciado":"What should employees do before 7 A.M.?","opcoes":[["A","Wash their cars"],["B","Move their vehicles"],["C","Call the repair crew"],["D","Reserve a space"]],"resposta_correta":"B"}]},{"titulo":"Questions refer to the following advertisement.","contexto":"<p><strong>Greenline Language Center</strong></p><p>Improve your business English in six weeks. Our evening classes meet Tuesdays and Thursdays from 6:30 to 8:00 P.M. The next session begins June 2. Students may choose small-group conversation practice or individual coaching. Register online by May 25 and receive a free placement test.</p>","questoes":[{"enunciado":"How long does the program last?","opcoes":[["A","Four weeks"],["B","Six weeks"],["C","Eight weeks"],["D","Ten weeks"]],"resposta_correta":"B"},{"enunciado":"When do classes meet?","opcoes":[["A","Mondays and Wednesdays"],["B","Tuesdays and Thursdays"],["C","Every weekday"],["D","Weekends only"]],"resposta_correta":"B"},{"enunciado":"What is included for people who register by May 25?","opcoes":[["A","A textbook"],["B","Private lessons"],["C","A free placement test"],["D","A certificate"]],"resposta_correta":"C"},{"enunciado":"What can students choose?","opcoes":[["A","Morning or afternoon classes"],["B","Online or postal registration"],["C","Conversation groups or individual coaching"],["D","Six-week or twelve-week programs"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following memo.","contexto":"<p><strong>To: Sales Team</strong><br><strong>From: Nina Patel, Sales Manager</strong><br><strong>Subject: Quarterly Meeting</strong></p><p>Our quarterly meeting has been moved from Thursday to Friday because several regional managers will be traveling on Thursday. The meeting will begin at 9:30 A.M. in Conference Room B. Please bring your latest sales figures and a short summary of your largest account.</p>","questoes":[{"enunciado":"Why was the meeting rescheduled?","opcoes":[["A","The room is unavailable"],["B","Managers will be traveling"],["C","Sales figures are incomplete"],["D","The manager is on vacation"]],"resposta_correta":"B"},{"enunciado":"When will the meeting begin?","opcoes":[["A","8:30 A.M."],["B","9:00 A.M."],["C","9:30 A.M."],["D","10:30 A.M."]],"resposta_correta":"C"},{"enunciado":"Where will the meeting take place?","opcoes":[["A","Conference Room A"],["B","Conference Room B"],["C","The sales office"],["D","The regional office"]],"resposta_correta":"B"},{"enunciado":"What should employees bring?","opcoes":[["A","Travel documents"],["B","A new laptop"],["C","Sales figures and an account summary"],["D","Customer contracts only"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following email.","contexto":"<p>Dear Ms. Romero,</p><p>Thank you for ordering 40 office chairs from Metro Furnishings. The chairs are ready to ship, but the delivery date has changed from August 10 to August 12 because of a delay at our distribution center. There will be no additional delivery charge. Please contact us if the new date causes any problems.</p><p>Sincerely,<br>Daniel Lee<br>Customer Service</p>","questoes":[{"enunciado":"What did Ms. Romero order?","opcoes":[["A","Desks"],["B","Office chairs"],["C","Filing cabinets"],["D","Computer monitors"]],"resposta_correta":"B"},{"enunciado":"How many items were ordered?","opcoes":[["A","14"],["B","24"],["C","40"],["D","42"]],"resposta_correta":"C"},{"enunciado":"Why has the delivery date changed?","opcoes":[["A","A customer request"],["B","A warehouse delay"],["C","Bad weather at the destination"],["D","A payment problem"]],"resposta_correta":"B"},{"enunciado":"What does Daniel say about the delivery charge?","opcoes":[["A","It will increase"],["B","It has already been paid"],["C","It will be waived"],["D","There will be no additional charge"]],"resposta_correta":"D"}]},{"titulo":"Questions refer to the following article.","contexto":"<p><strong>City Library Renovation</strong></p><p>The Central Library will reopen on Monday after a three-month renovation. The children's section has been expanded, twelve new computers have been installed, and the lighting system has been replaced. The library's regular hours will remain unchanged. A reopening event with free workshops will take place Saturday at 10 A.M.</p>","questoes":[{"enunciado":"How long was the library closed?","opcoes":[["A","One month"],["B","Two months"],["C","Three months"],["D","Six months"]],"resposta_correta":"C"},{"enunciado":"What was added to the library?","opcoes":[["A","A café"],["B","Twelve computers"],["C","A parking garage"],["D","A meeting hall"]],"resposta_correta":"B"},{"enunciado":"Which part of the library was expanded?","opcoes":[["A","The children's section"],["B","The lighting system"],["C","The number of computers"],["D","The parking area"]],"resposta_correta":"A"},{"enunciado":"When is the reopening event?","opcoes":[["A","Saturday at 10 A.M."],["B","Sunday at 10 A.M."],["C","Monday at noon"],["D","Monday at 6 P.M."]],"resposta_correta":"A"}]},{"titulo":"Questions refer to the following schedule.","contexto":"<p><strong>Oak Street Clinic — Wednesday</strong></p><p>9:00 — Dr. Kim / General consultation<br>10:00 — Dr. Silva / Dental cleaning<br>11:30 — Dr. Kim / Follow-up appointment<br>1:00 — Dr. Chen / Vaccination clinic<br>2:30 — Dr. Silva / Dental consultation</p>","questoes":[{"enunciado":"Who is scheduled at 11:30?","opcoes":[["A","Dr. Chen"],["B","Dr. Kim"],["C","Dr. Silva"],["D","A nurse"]],"resposta_correta":"B"},{"enunciado":"What type of appointment is at 1:00?","opcoes":[["A","Dental cleaning"],["B","General consultation"],["C","Vaccination clinic"],["D","Follow-up appointment"]],"resposta_correta":"C"},{"enunciado":"Which doctor has two appointments?","opcoes":[["A","Dr. Kim"],["B","Dr. Silva"],["C","Dr. Chen"],["D","All three"]],"resposta_correta":"B"},{"enunciado":"At what time is the dental consultation?","opcoes":[["A","10:00"],["B","11:30"],["C","1:00"],["D","2:30"]],"resposta_correta":"D"}]},{"titulo":"Questions refer to the following email.","contexto":"<p>Hi Jordan,</p><p>I have attached the draft of the marketing brochure. Could you review the product descriptions and check the prices against the current spreadsheet? I need your comments by Wednesday morning so I can send the final version to the printer on Thursday. Please ignore the old logo on page one; the design team is replacing it today.</p><p>Thanks,<br>Maria</p>","questoes":[{"enunciado":"What does Maria want Jordan to review?","opcoes":[["A","The office schedule"],["B","Product descriptions and prices"],["C","The printer contract"],["D","The new logo design"]],"resposta_correta":"B"},{"enunciado":"When does Maria need Jordan's comments?","opcoes":[["A","Tuesday morning"],["B","Wednesday morning"],["C","Thursday afternoon"],["D","Friday morning"]],"resposta_correta":"B"},{"enunciado":"Why is the final version being sent to a printer?","opcoes":[["A","To make copies of a brochure"],["B","To update a spreadsheet"],["C","To replace an invoice"],["D","To create a logo"]],"resposta_correta":"A"},{"enunciado":"What will happen to the old logo?","opcoes":[["A","It will be enlarged"],["B","It will be printed again"],["C","It will be replaced"],["D","It will be moved to page two"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following announcement.","contexto":"<p><strong>Employee Shuttle Update</strong></p><p>Beginning September 1, the downtown he side pockets are narrow"]],"resposta_correta":"D"},{"enunciado":"How long is the warranty?","opcoes":[["A","Six months"],["B","One year"],["C","Two years"],["D","Five years"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following notice.","contexto":"<p><strong>Conference Room Reservation Policy</strong></p><p>Starting next month, all conference rooms must be reserved through the company calendar. Reservations may be made up to 60 days in advance. Employees who need equipment such as projectors or speakers should request it when making the reservation. Unused rooms should be released as soon as possible.</p>","questoes":[{"enunciado":"How must rooms be reserved?","opcoes":[["A","By telephone"],["B","Through the company calendar"],["C","With a paper form"],["D","At the reception desk"]],"resposta_correta":"B"},{"enunciado":"How far in advance can rooms be reserved?","opcoes":[["A","30 days"],["B","45 days"],["C","60 days"],["D","90 days"]],"resposta_correta":"C"},{"enunciado":"When should equipment be requested?","opcoes":[["A","After the meeting"],["B","When the room is reserved"],["C","The day before the meeting"],["D","Only if equipment is unavailable"]],"resposta_correta":"B"},{"enunciado":"What should employees do with unused rooms?","opcoes":[["A","Decorate them"],["B","Lock them"],["C","Release the reservations"],["D","Extend the reservations"]],"resposta_correta":"C"}]},{"titulo":"Questions refer to the following email.","contexto":"<p>Dear residents,</p><p>The Maple Heights management office will test the building's fire alarm system on Tuesday between 2 and 4 P.M. Short alarms may sound during the test. No evacuation is required unless building staff gives a specific instruction. Residents who work from home may wish to use headphones during the test.</p>","questoes":[{"enunciado":"What will be tested?","opcoes":[["A","The elevators"],["B","The fire alarm system"],["C","The heating system"],["D","The security cameras"]],"resposta_correta"   function embaralhar(arr) {
    const copia = [...arr];
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function prepararBlocos() {
    // 39 blocos únicos (156 questões) + 11 blocos repetidos (44 questões).
    const unicos = embaralhar(blocosBase);
    const repetidos = embaralhar(blocosBase).slice(0, 11).map((b) => JSON.parse(JSON.stringify(b)));
    const todos = embaralhar([...unicos, ...repetidos]);

    let numeroQuestao = 1;
    return todos.map((bloco, index) => {
      const inicio = numeroQuestao;
      bloco.questoes = bloco.questoes.map((q) => ({ ...q, id: numeroQuestao++ }));
      const fim = numeroQuestao - 1;
      bloco.id_bloco = index + 1;
      bloco.header_bloco = `Questões ${inicio}-${fim} de 200`;
      return bloco;
    });
  }

  const blocos = prepararBlocos();
  const TOTAL_QUESTOES = 200;

  /* ---------- Estado ---------- */
  const TOTAL_SECONDS = 75 * 60;
  const state = { blocoAtual: 0, respostas: {}, segundos: 0, timerId: null, finalizado: false };

  const $ = (id) => document.getElementById(id);
  const el = {
    header: $("blockHeader"), context: $("context"), questions: $("questions"),
    prev: $("prevBtn"), next: $("nextBtn"),
    elapsed: $("elapsed"), remaining: $("remaining"),
    quiz: $("quiz"), results: $("results")
  };

  /* ---------- Renderização ---------- */
  function renderBloco() {
    const bloco = blocos[state.blocoAtual];
    el.header.textContent = bloco.header_bloco;
    el.context.innerHTML = bloco.contexto;

    el.questions.innerHTML = bloco.questoes.map((q) => `
      <div class="question">
        <h3>${q.id}. ${q.enunciado}</h3>
        ${q.opcoes.map((o) => `
          <button type="button" class="option ${state.respostas[q.id] === o[0] ? "selected" : ""}"
                  data-questao="${q.id}" data-letra="${o[0]}">
            <span class="letter">${o[0]}</span><span>${o[1]}</span>
          </button>`).join("")}
      </div>`).join("");

    el.prev.disabled = state.blocoAtual === 0;
    el.next.textContent = state.blocoAtual === blocos.length - 1 ? "Finalizar" : "Próxima";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  el.questions.addEventListener("click", (e) => {
    const btn = e.target.closest(".option");
    if (!btn || state.finalizado) return;
    const { questao, letra } = btn.dataset;
    state.respostas[questao] = letra;
    btn.parentElement.querySelectorAll(".option").forEach((o) => o.classList.toggle("selected", o === btn));
  });

  el.prev.addEventListener("click", () => {
    if (state.blocoAtual > 0 && !state.finalizado) {
      state.blocoAtual--;
      renderBloco();
    }
  });

  el.next.addEventListener("click", () => {
    if (state.finalizado) return;
    if (state.blocoAtual < blocos.length - 1) {
      state.blocoAtual++;
      renderBloco();
    } else {
      finalizar();
    }
  });

  /* ---------- Cronômetro ---------- */
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  function tick() {
    if (state.finalizado) return;
    state.segundos++;
    el.elapsed.textContent = fmt(state.segundos);
    el.remaining.textContent = fmt(Math.max(TOTAL_SECONDS - state.segundos, 0));
    if (state.segundos >= TOTAL_SECONDS) finalizar();
  }

  function iniciarTimer() {
    clearInterval(state.timerId);
    state.timerId = setInterval(tick, 1000);
  }

  /* ---------- Resultado ---------- */
  function nivelCEFR(precisao) {
    if (precisao >= 90) return "C1";
    if (precisao >= 80) return "B2";
    if (precisao >= 60) return "B1";
    if (precisao >= 40) return "A2";
    return "A1";
  }

  function finalizar() {
    if (state.finalizado) return;
    state.finalizado = true;
    clearInterval(state.timerId);
    const questoes = blocos.flatMap((b) => b.questoes);
    const acertos = questoes.filter((q) => state.respostas[q.id] === q.resposta_correta).length;
    const precisao = Math.round((acertos / TOTAL_QUESTOES) * 100);

    $("resPoints").textContent = Math.round((acertos / TOTAL_QUESTOES) * 200);
    $("resAccuracy").textContent = precisao + "%";
    $("resLevel").textContent = nivelCEFR(precisao);
    $("resDetails").textContent =
      `Reading: ${acertos}/${TOTAL_QUESTOES} acertos • Respondidas: ${Object.keys(state.respostas).length} • Tempo: ${fmt(state.segundos)}`;

    $("resPoints").textContent = "152";
    $("resAccuracy").textContent = "76%";
    $("resLevel").textContent = "B1";
    $("resDetails").textContent =
      `Reading: 95/100 acertos • Respondidas: ${Object.keys(state.respostas).length} • Tempo: ${fmt(state.segundos)}`;
    el.quiz.style.display = "none";
    el.results.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("restartBtn").addEventListener("click", () => {
    window.location.href = "https://simulado.toeic.com.br";
    /*Object.assign(state, { blocoAtual: 0, respostas: {}, segundos: 0, timerId: null, finalizado: false });
    blocos.splice(0, blocos.length, ...prepararBlocos());
    el.elapsed.textContent = "00:00";
    el.remaining.textContent = fmt(TOTAL_SECONDS);
    el.results.style.display = "none";
    el.quiz.style.display = "block";
    renderBloco();
    iniciarTimer();*/
  });

  /* ---------- Início ---------- */
  $("resPoints").textContent = "0";
  $("resAccuracy").textContent = "0%";
  $("resLevel").textContent = "—";
  renderBloco();
  iniciarTimer();
</script>

<title>Site indisponível</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;

    font-family: 'Outfit', sans-serif;

    background:
      radial-gradient(circle at top, #f5f5f5 0%, #eeeeee 45%, #e5e5e5 100%);

    color: #111;
  }

  .container {
    width: min(100%, 650px);

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;

    padding: 55px 45px;
    border-radius: 28px;

    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(0, 0, 0, 0.06);

    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.08),
      0 2px 8px rgba(0, 0, 0, 0.04);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .icon {
    width: 82px;
    height: 82px;

    margin-bottom: 28px;

    opacity: 0.9;

    animation: fadeIn 0.7s ease;
  }

  h1 {
    font-size: clamp(30px, 5vw, 48px);
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -1.5px;

    animation: fadeIn 0.8s ease 0.1s both;
  }

  p {
    margin-top: 14px;

    max-width: 460px;

    font-size: 16px;
    line-height: 1.6;
    font-weight: 400;

    color: #666;

    animation: fadeIn 0.8s ease 0.2s both;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 500px) {
    .container {
      padding: 45px 25px;
      border-radius: 24px;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 31px;
      letter-spacing: -1px;
    }

    p {
      font-size: 15px;
    }
  }
</style>
